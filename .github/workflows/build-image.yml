name: Build and Push Image

# Tests run on every PR touching main; the IMAGE is built on release only.
#
# Why release-only: the image tag IS the version, and home-k8s pins an explicit
# tag (`ghcr.io/konnektr-io/bim-viewer:v0.1.0`). Building on every main push
# produced a `latest` that CI moved under a running deployment, so the cluster
# silently redeployed on every merge and the running version was untraceable.
# `gh release create vX.Y.Z` creates the tag, which is what triggers the build.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test (frontend typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend (tsc -b + vite build)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import backend
        run: |
          pip install -r app/requirements.txt
          python -c "import app.main; print('backend imports OK')"

  build:
    name: Build and push image
    # Release-only: a PR must never publish an image. The test job still runs on
    # PRs (it has no `needs`), so PRs keep the frontend build as their gate.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # semver patterns keep the `v` prefix: this package publishes
          # v0.1.0 / v0.1 / v0, matching what home-k8s pins. (graph-explorer
          # strips it — the v-handling is per-repo, so verify against a known
          # prior release before asserting a tag exists.)
          #
          # No `latest`, deliberately. With release-only builds it would never
          # be updated again, so it would sit frozen on whatever the last
          # main-push build produced and read as current. home-k8s pins an
          # explicit tag; one source of truth.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
